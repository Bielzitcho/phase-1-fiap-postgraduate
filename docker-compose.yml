services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: oficina_tech
      POSTGRES_USER: oficina
      POSTGRES_PASSWORD: oficina_secret
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oficina -d oficina_tech"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=oficina_tech;Username=oficina;Password=oficina_secret
      - Admin__Email=admin@oficina.tech
      - Admin__PasswordHash=$$2a$$11$$LH6vF4jH.IUgMeHC9324Xe.AiaauQ7.ewUgedeygXqd4L/XG0CJK6
      - Admin__JwtSecret=oficina-tech-jwt-secret-key-fiap-2026
      - Admin__JwtIssuer=oficina-tech-api
      - Admin__JwtAudience=oficina-tech-admin
      - Admin__JwtExpiryMinutes=60
    depends_on:
      postgres:
        condition: service_healthy
